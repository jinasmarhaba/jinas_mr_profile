<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f4ed">
<title>Jinas — A Story of His Own</title>
<meta name="description" content="Discover the personal profile of Muhammed Jinas KJ.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --bg: #f7f4ed;
  --paper: #fffefa;
  --ink: #292a23;
  --muted: #77776d;
  --olive: #667052;
  --olive-dark: #3f4935;
  --rust: #b76f52;
  --sand: #e8dfd0;
  --line: #e8e3d8;
  --serif: "Playfair Display", Georgia, serif;
  --sans: "DM Sans", Arial, sans-serif;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 95px;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; }
img { max-width: 100%; }

::selection {
  background: #d9ddc9;
  color: var(--ink);
}

.navbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(247,244,237,.92);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(41,42,35,.08);
}

.nav-inner {
  max-width: 1320px;
  min-height: 76px;
  padding: 12px 34px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 22px;
}

.logo {
  font-family: var(--serif);
  font-size: 27px;
  font-weight: 600;
  letter-spacing: -.07em;
}

.logo span { color: var(--rust); }

.nav-links {
  display: flex;
  align-items: center;
  gap: 28px;
  font-size: 11px;
  font-weight: 600;
  color: #55564d;
}

.nav-links a:hover { color: var(--rust); }

.nav-button {
  background: var(--ink);
  color: white !important;
  border-radius: 30px;
  padding: 12px 19px;
}

.intro {
  max-width: 1320px;
  padding: 64px 34px 54px;
  margin: auto;
}

.intro-label {
  color: var(--olive);
  font-size: 10px;
  letter-spacing: .2em;
  font-weight: 700;
  text-transform: uppercase;
}

.intro-grid {
  display: grid;
  grid-template-columns: 1fr .9fr;
  gap: 55px;
  align-items: center;
  margin-top: 25px;
}

.intro h1 {
  font-family: var(--serif);
  font-size: clamp(55px, 7.2vw, 100px);
  font-weight: 400;
  letter-spacing: -.065em;
  line-height: .98;
  margin: 0;
}

.intro h1 em {
  display: block;
  color: var(--olive);
  font-weight: 400;
}

.intro-description {
  max-width: 440px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.9;
  margin: 25px 0;
}

.intro-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.tag {
  border: 1px solid #dcd7ca;
  background: rgba(255,254,250,.6);
  padding: 9px 13px;
  border-radius: 30px;
  color: #55574b;
  font-size: 10px;
}

.intro-links {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 28px;
}

.pill-button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 14px 21px;
  border-radius: 40px;
  font-size: 11px;
  font-weight: 700;
  transition: transform .2s, background .2s;
}

.pill-button:hover { transform: translateY(-2px); }

.pill-dark { color: white; background: var(--ink); }
.pill-light { background: #e9e5d9; color: var(--ink); }

.hero-collage {
  display: grid;
  grid-template-columns: 1.08fr .82fr;
  gap: 13px;
  align-items: center;
  max-width: 510px;
  justify-self: end;
  width: 100%;
}

.collage-column {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.collage-column.offset { padding-top: 43px; }

.pin {
  display: block;
  padding: 7px;
  background: var(--paper);
  border-radius: 6px;
  box-shadow: 0 7px 24px rgba(54,48,34,.07);
  overflow: hidden;
  cursor: pointer;
  transition: transform .3s, box-shadow .3s;
}

.pin:hover {
  transform: translateY(-5px) rotate(-.5deg);
  box-shadow: 0 15px 35px rgba(54,48,34,.13);
}

.pin img {
  display: block;
  width: 100%;
  object-fit: cover;
  border-radius: 3px;
  background: #e8e0d0;
}

.pin-one img { height: 285px; }
.pin-two img { height: 180px; }
.pin-three img { height: 195px; }
.pin-four img { height: 260px; }

.pin-caption {
  padding: 10px 7px 7px;
  font-family: var(--serif);
  font-size: 15px;
  color: #4c4d40;
}

.section {
  max-width: 1240px;
  margin: auto;
  padding: 76px 34px;
}

.section-top {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
  margin-bottom: 29px;
}

.kicker {
  color: var(--rust);
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  font-weight: 700;
}

.section-title {
  font-family: var(--serif);
  font-size: clamp(36px, 5vw, 57px);
  line-height: 1.1;
  letter-spacing: -.04em;
  font-weight: 400;
  margin: 10px 0 0;
}

.section-note {
  color: var(--muted);
  font-size: 12px;
  max-width: 320px;
  line-height: 1.8;
}

.story-section { border-top: 1px solid var(--line); }

.story-grid {
  display: grid;
  grid-template-columns: .75fr 1.25fr;
  gap: 55px;
  align-items: stretch;
}

.story-note {
  background: #e9e5d9;
  padding: 34px;
  border-radius: 5px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 280px;
}

.story-note .big-mark {
  font-family: var(--serif);
  font-size: 70px;
  line-height: 1;
  color: var(--olive);
}

.story-note h3 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 30px;
  line-height: 1.25;
  margin: 22px 0;
}

.story-note small {
  color: var(--olive);
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.story-copy {
  align-self: center;
  padding: 10px 0;
}

.story-copy h3 {
  font-family: var(--serif);
  font-size: 31px;
  font-weight: 400;
  margin: 0 0 16px;
}

.story-copy p {
  font-size: 14px;
  line-height: 2;
  color: #67685f;
  margin: 0;
  max-width: 680px;
}

.profile-section {
  background: #efede4;
  border-top: 1px solid #e5e1d5;
  border-bottom: 1px solid #e5e1d5;
}

.profile-inner {
  max-width: 1240px;
  margin: auto;
  padding: 76px 34px;
}

.profile-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 13px;
}

.info-card {
  background: var(--paper);
  border-radius: 5px;
  padding: 20px;
  min-height: 112px;
  border: 1px solid rgba(50,48,37,.045);
  transition: transform .22s, box-shadow .22s;
}

.info-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(50,48,37,.07);
}

.info-label {
  color: #858477;
  text-transform: uppercase;
  letter-spacing: .13em;
  font-size: 9px;
  font-weight: 700;
  margin-bottom: 10px;
}

.info-value {
  font-family: var(--serif);
  color: #35372d;
  font-size: 21px;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.profile-footnote {
  color: var(--muted);
  font-size: 11px;
  margin-top: 22px;
}

/* CAREER SECTION — added without changing the existing theme */
.career-section {
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.career-inner {
  max-width: 1240px;
  margin: auto;
  padding: 76px 34px;
}

.career-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.career-card {
  background: var(--paper);
  border: 1px solid rgba(50,48,37,.06);
  border-radius: 6px;
  padding: 27px;
  min-width: 0;
  transition: transform .22s, box-shadow .22s;
}

.career-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(50,48,37,.07);
}

.career-company {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  margin-bottom: 25px;
}

.company-wordmark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  min-width: 105px;
  min-height: 48px;
  padding: 9px 12px;
  border-radius: 4px;
  background: #f2efe6;
  font-family: Arial, sans-serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -.06em;
  white-space: nowrap;
}

  color: #202020;
}
